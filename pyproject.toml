[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rightsrelay"
version = "0.1.0"
description = "Revocation-aware synthetic voice media pipelines with Genblaze and Backblaze B2"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.141.1",
  "genblaze-core==0.3.8",
  "genblaze-s3==0.3.6",
  "jinja2==3.1.6",
  "piper-tts==1.6.0",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.52.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rightsrelay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv]
# Genblaze 0.3.8 declares Pillow <12, but RightsRelay uses only its audio and
# provenance paths. Pillow 11.3.0 has known 2026 advisories; 12.3.0 is the
# fixed release. The full test suite validates this deliberate compatibility
# override until the upstream bound is widened.
override-dependencies = ["pillow==12.3.0"]
