name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RIGHTSRELAY_TEST_MODEL_DIR: ${{ github.workspace }}/.models

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked environment
        run: |
          python -m pip install uv==0.11.25
          uv sync --frozen --extra dev --no-editable

      - name: Download pinned Piper voice
        run: .venv/bin/python scripts/download_voice.py

      - name: Lint and format check
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Test real synthesis and provenance
        run: .venv/bin/python -m pytest -q
